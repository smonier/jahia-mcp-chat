# default configuration - won't be overriden
# Jahia MCP Chat - main configuration
#
# Deployed to digital-factory-data/karaf/etc/org.jahia.se.modules.mcpchat.cfg; edit it there, changes
# apply without a redeploy. The marker above keeps operator edits on redeploy.
#
# The models, their providers and their keys belong to genai-connector (org.jahia.modules.genai.cfg):
# this module holds no API key. MCP servers have their own files,
# org.jahia.se.modules.mcpchat.server-<name>.cfg.

# Model tier used when a user has not chosen one: advanced, balanced or lite.
# Each tier's provider and model are set in genai-connector.
DEFAULT_TIER=balanced

# Ceiling on output tokens per model call; users may ask for less. 0 keeps the tier's own value.
MAX_TOKENS=0

# Instructions appended to the system prompt (site conventions, tone, forbidden operations).
# Plain text or Markdown; continue long values with a trailing backslash.
SYSTEM_PROMPT_APPENDIX=

# Base URL users reach this Jahia at (scheme, host, context path), used for the OAuth redirect URI
# registered with remote MCP servers: <PUBLIC_BASE_URL>/modules/jahia-mcp-chat/oauth/callback.
# Leave blank to take it from the request; set it behind a reverse proxy.
PUBLIC_BASE_URL=
