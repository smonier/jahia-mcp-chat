# default configuration - won't be overriden
# Jahia MCP Chat - one MCP server (factory configuration)
#
# One file per server in digital-factory-data/karaf/etc/, named
#   org.jahia.se.modules.mcpchat.server-<name>.cfg
# Adding, editing or removing a file takes effect without a redeploy.
# With no server file at all, the chat uses the local Jahia MCP server (/modules/mcp).
#
# name       Lowercase letters, digits, "-" and single "_". Prefixes the tool names
#            the LLM sees (<name>__<tool>), so keep it short and stable.
# label      Name shown to users.
# url        Relative (/modules/mcp): a server on this Jahia, called by the browser
#            with the user's own session.
#            Absolute (https://...): a remote server, called through the module's
#            proxy, which adds the credentials below. They never reach the browser.
# authHeader Header sent to a remote server (default Authorization).
# authValue  Its value, e.g. "Bearer <token>". Never commit a real value.
# oauthGrant For a remote server that answers 401 (OAuth):
#            authorization_code (default) - each user signs in once from the chat
#            settings (Connect); the module registers itself with the server.
#            client_credentials - one account for every user (client id + secret).
# oauthClientId, oauthClientSecret
#            Optional for authorization_code (pre-registered client), required
#            for client_credentials.
# oauthScope Scopes to request; empty = the scopes the server advertises.
# oauthTokenUrl
#            Token endpoint for client_credentials; empty = discovered.
# timeoutMs  Request timeout for a remote server (default 60000).
# sites      Comma-separated site keys allowed to use the server; empty = every site.
# enabled    false hides the server.
name=jahia
label=Jahia
url=/modules/mcp
authHeader=Authorization
authValue=
timeoutMs=60000
sites=
enabled=true
