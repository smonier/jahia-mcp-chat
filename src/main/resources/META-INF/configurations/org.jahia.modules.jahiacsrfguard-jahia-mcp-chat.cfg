# Owned by the module: replaced on every deploy (no "default configuration" header on purpose).
# CSRF guard for jahia-mcp-chat servlets.
# All paths under /modules/jahia-mcp-chat/* require a CSRF token on mutating requests.
# Front-end POSTs must include the token fetched from /modules/CsrfServlet
# as the JAHIA-CSRF-TOKEN header.
urlPatterns = /modules/jahia-mcp-chat/*
# The OAuth sign-in redirects are top-level navigations (a popup, then the server sending the browser back):
# they cannot carry the token. /start only prepares a sign-in bound to the session; /callback is protected by
# the OAuth state, single-use and bound to the session and the user. /oauth/signout stays under the guard.
whitelist = /modules/jahia-mcp-chat/oauth/start*, /modules/jahia-mcp-chat/oauth/callback*
