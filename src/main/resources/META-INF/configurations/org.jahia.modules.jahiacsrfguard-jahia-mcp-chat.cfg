# default configuration - won't be overriden
# CSRF guard for jahia-mcp-chat servlets.
# All paths under /modules/jahia-mcp-chat/* require a CSRF token on mutating requests.
# Front-end POSTs must include the token fetched from /modules/CsrfServlet
# as the JAHIA-CSRF-TOKEN header.
urlPatterns = /modules/jahia-mcp-chat/*
